[workspace]
members = [
    "day-*",
    "day-01",
]
default-members = ["day-*"]
resolver = "3"

[workspace.dependencies]
divan = "0.1.21"
glam = "0.30.9"
itertools = "0.13.0"
nom = "7.1.3"
rstest = "0.23.0"
rstest_reuse = "0.7.0"
thiserror = "2.0.17"
tracing = "0.1.44"

[workspace.dependencies.miette]
version = "7.6"
features = ["fancy"]

[workspace.dependencies.test-log]
version = "0.2.19"
features = ["trace"]
default-features = false

[workspace.dependencies.tracing-subscriber]
version = "0.3.22"
features = [
    "fmt",
    "env-filter",
]
